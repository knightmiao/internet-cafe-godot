<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网吧经营模拟 · UI框架 vA 复古网咖风</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#3a2b22;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
/* 游戏窗口 1280x720 */
.screen{width:1280px;height:720px;background:#f5ead1;border:6px solid #6b4a2f;border-radius:6px;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* ① 顶栏 */
.topbar{height:54px;background:linear-gradient(#7a4a2a,#5c3a20);border-bottom:3px solid #b8860b;display:flex;align-items:center;padding:0 14px;gap:22px;color:#ffe9c9;flex-shrink:0}
.topbar .name{font-size:18px;font-weight:700;letter-spacing:2px;color:#ffcf7a;text-shadow:0 0 8px #ff9a00}
.topbar .stat{display:flex;align-items:center;gap:6px;font-size:14px}
.topbar .stat .v{font-weight:700;color:#fff}
.topbar .spacer{flex:1}
/* 主体：俯视图 + 侧视面板 */
.middle{flex:1;display:flex;overflow:hidden}
/* ③ 俯视平面图 */
.topview{flex:1;background:#e8dcc0;position:relative;border-right:3px solid #b8860b}
.topview .floor{position:absolute;inset:10px;border:2px dashed #b3905e;border-radius:4px}
.topview .zone{position:absolute;background:rgba(139,101,58,.16);border:1px solid #b3905e;border-radius:4px;padding:4px;font-size:10px;color:#6b4a2f;display:flex;align-items:center}
.topview .shop{border-color:#c0662a;background:rgba(192,102,42,.16)}
.topview .booth{border-color:#6d8a3a;background:rgba(109,138,58,.16)}
.topview .minibar{border-color:#3a7ca5;background:rgba(58,124,165,.16)}
/* 俯视图里的机器格子 */
.pc{position:absolute;width:8px;height:8px;background:#8b5e3c;border-radius:1px}
.pc.free{background:#7ea84e}
.pc.used{background:#c0392b}
/* 俯视图里的客人点 */
.guest{position:absolute;width:10px;height:10px;background:#2c3e50;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
/* ④ 右侧侧视 吧台 */
.sideview{width:362px;background:linear-gradient(#3f2f23,#2e2218);color:#ffe9c9;display:flex;flex-direction:column;flex-shrink:0}
.sideview .sv-head{padding:10px 12px;background:#5c3a20;border-bottom:2px solid #b8860b;font-size:13px;font-weight:700;color:#ffcf7a;display:flex;justify-content:space-between}
/* 侧视场景区（吧台特写） */
.sv-scene{flex:1;position:relative;background:linear-gradient(#4a3628,#33241890);overflow:hidden}
.sv-scene .counter{position:absolute;bottom:0;left:0;right:0;height:54px;background:linear-gradient(#7a4a2a,#5c3a20);border-top:3px solid #a8742e}
.sv-scene .bar-back{position:absolute;bottom:54px;left:0;right:0;height:110px;background:linear-gradient(#2a1f16,#1f1710);border-top:3px solid #a8742e;display:flex;align-items:center;justify-content:center;color:#ffe9c9;font-size:13px;letter-spacing:1px;opacity:.9}
.sv-scene .customer{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:40px}
.sv-scene .bubble{position:absolute;top:14px;right:14px;background:#fff8e7;color:#5c3a20;padding:7px 10px;border-radius:8px;font-size:12px;box-shadow:2px 3px 8px rgba(0,0,0,.4)}
/* 操作按钮快捷栏 */
.sv-actions{border-top:2px solid #a8742e;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#332418}
.btn{padding:8px 4px;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;border:1px solid rgba(0,0,0,.3)}

<EOF
